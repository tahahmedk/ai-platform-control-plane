# Local mock sandbox. No public ingress. Replace the image with your locally built image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ai-platform-control-plane}
  template:
    metadata:
      labels: {app: ai-platform-control-plane}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ai-platform-control-plane:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-platform-control-plane
spec:
  selector: {app: ai-platform-control-plane}
  ports: [{port: 80, targetPort: 8000}]
