# Requires a CNI enforcing NetworkPolicy. Mock adapters need no outbound access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-platform-control-plane
spec:
  podSelector:
    matchLabels: {app: ai-platform-control-plane}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {ai-platform-client: "true"}
      ports: [{protocol: TCP, port: 8000}]
  egress: []
